<section class="spark">
  <h2>La teva espurna</h2>

  @if (prompt) {
  <p>{{ prompt.text }}</p>
  }

  <div class="home-actions">
    <button class="spark-btn" (click)="getRandomPrompt()">Una altra espurna</button>
    <button class="write-btn" [routerLink]="['/write']" [queryParams]="{ promptId: prompt?.id }">Escriure</button>
  </div>
</section>
