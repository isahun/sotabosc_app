<section class="login">
  <h2>Inicia sessió</h2>

  <form (ngSubmit)="login()">
    <label for="email">Correu electrònic</label>
    <input
      id="email"
      type="email"
      [(ngModel)]="email"
      name="email"
      required
    />

    <label for="password">Contrasenya</label>
    <input
      id="password"
      type="password"
      [(ngModel)]="password"
      name="password"
      required
    />

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    <button type="submit">Entrar</button>
  </form>

  <p>
    Encara no tens compte?
    <a routerLink="/auth/register">Crea'n un</a>
  </p>
</section>
