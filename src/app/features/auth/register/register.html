<section class="register">
  <h2>Crea el teu compte</h2>

  <form (ngSubmit)="register()">
    <label for="email">Correu electrònic</label>
    <input
      id="email"
      type="email"
      [(ngModel)]="email"
      name="email"
      required
    />

    <label for="password">Contrasenya</label>
    <input
      id="password"
      type="password"
      [(ngModel)]="password"
      name="password"
      required
    />

    <label for="passwordConfirmation">Repeteix la contrasenya</label>
    <input
      id="passwordConfirmation"
      type="password"
      [(ngModel)]="passwordConfirmation"
      name="passwordConfirmation"
      required
    />

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    <button type="submit">Crear compte</button>
  </form>

  <p>
    Ja tens compte?
    <a routerLink="/auth/login">Inicia sessió</a>
  </p>
</section>
