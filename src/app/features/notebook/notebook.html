<section class="notebook">
  <h2>Quadern de notes</h2>

  @if (entries.length === 0) {
  <p>Encara no hi ha cap entrada.</p>
  }

  @for (entry of entries; track entry.id) {
    <article>
      <div class="entry-info">
        <h3>{{ entry.title || 'Sense títol' }}</h3>
        <p>{{ entry.createdAt }}</p>
      </div>
      <div class="entry-actions">
        <a [routerLink]="['/notebook', entry.id]">Veure entrada</a>
        <button (click)="deleteEntry(entry)">Eliminar entrada</button>
        <a [routerLink]="['/write']" [queryParams]="{ entryId: entry.id }">Editar entrada</a>

      </div>
    </article>
  }
</section>
