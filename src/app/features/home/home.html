<section class="home">
  <h2>Què vols escriure avui?</h2>

  <div class="writing-modes">
  <a routerLink="/spark" [queryParams]="{ category: 'journal' }" class="mode-btn">
    <span class="initial-typo">Journal</span>
  </a>

  <a routerLink="/spark" [queryParams]="{ category: 'automatic' }" class="mode-btn">
    <span class="initial-typo">Escriptura automàtica</span>
  </a>

  <a routerLink="/spark" [queryParams]="{ category: 'poetry' }" class="mode-btn">
    <span class="initial-typo">Poesia</span>
  </a>

  <a routerLink="/spark" [queryParams]="{ category: 'free' }" class="mode-btn">
    <span class="initial-typo">Escriptura lliure</span>
  </a>
</div>

  <div class="home-actions">
    <button class="spark-btn" (click)="surpriseMe()">✦ Sorprèn-me</button>
    <button class="write-btn" [routerLink]="['/write']">Escriure sense espurna</button>
  </div>
</section>
